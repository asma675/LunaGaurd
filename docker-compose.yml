services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile


    ports:
      - "8000:8000"

    environment:
      - LUNAGUARD_ENV=production
      - LOG_LEVEL=info
      - CORS_ORIGINS=http://localhost:3000
      - WATSONX_API_KEY=${WATSONX_API_KEY:-}
      - WATSONX_PROJECT_ID=${WATSONX_PROJECT_ID:-}
      - WATSONX_URL=${WATSONX_URL:-https://us-south.ml.cloud.ibm.com}
      - WATSONX_MODEL_ID=${WATSONX_MODEL_ID:-ibm/granite-3-3-8b-instruct}
      - WATSON_TTS_API_KEY=${WATSON_TTS_API_KEY:-}
      - WATSON_TTS_URL=${WATSON_TTS_URL:-}
      - WATSON_STT_API_KEY=${WATSON_STT_API_KEY:-}
      - WATSON_STT_URL=${WATSON_STT_URL:-}
      - NASA_API_KEY=${NASA_API_KEY:-DEMO_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - LUNAGUARD_AUTH_DB=/app/runtime/lunaguard_auth.db

    volumes:
      - ./data:/app/data:ro
      - lunaguard_auth:/app/runtime

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_CREATOR_LINKEDIN: ${NEXT_PUBLIC_CREATOR_LINKEDIN:-}
        NEXT_PUBLIC_CREATOR_GITHUB: ${NEXT_PUBLIC_CREATOR_GITHUB:-}


    ports:
      - "3000:3000"

    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_DEMO_MODE=true
      - NEXT_PUBLIC_CREATOR_LINKEDIN=${NEXT_PUBLIC_CREATOR_LINKEDIN:-}
      - NEXT_PUBLIC_CREATOR_GITHUB=${NEXT_PUBLIC_CREATOR_GITHUB:-}

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

volumes:
  lunaguard_auth:

